<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Británico | Panel Institucional</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #2c3e50;
            --border-radius: 12px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem 1rem;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
        }

        .back-nav {
            max-width: 800px;
            margin: 0 auto 1rem auto;
            text-align: left;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .back-button:hover {
            color: #004080;
            text-decoration: underline;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        header p {
            color: #666;
            font-size: 1rem;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }

        .card h2 {
            font-size: 1.4rem;
            color: var(--primary-color);
        }

        footer {
            text-align: center;
            padding: 1.5rem 1rem;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <div class="back-nav">
            <a href="../index.html" class="back-button">← Volver al Portal Principal</a>
        </div>
        <h1>Británico</h1>
        <p>Selecciona el módulo al que deseas acceder</p>
    </header>

    <main>
        <div class="cards-container">
            <!-- Botón 1: Autoevaluaciones -->
            <a href="./autoevaluaciones/index.html" class="card">
                <div class="card-icon">📝</div>
                <h2>Autoevaluaciones</h2>
            </a>

            <!-- Botón 2: Sistema Académico -->
            <a href="./sistemaacademico/index.html" class="card">
                <div class="card-icon">🎓</div>
                <h2>Sistema Académico</h2>
            </a>
        </div>
    </main>

    <footer>
        <p>leonarperezaltamirano derechos reservados</p>
    </footer>

</body>
</html>
