<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Tecnológico</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 2.5rem 1rem;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
        }

        header h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #666;
            font-size: 1rem;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }

        .card h2 {
            font-size: 1.5rem;
            color: #2c3e50;
        }

        footer {
            text-align: center;
            padding: 1.5rem 1rem;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenido al Portal Tecnológico</h1>
        <p>Selecciona la institución a la que deseas acceder</p>
    </header>

    <main>
        <div class="cards-container">
            <!-- Acceso a Británico -->
            <a href="./britanico/" class="card">
                <div class="card-icon">🏫</div>
                <h2>Británico</h2>
            </a>

            <!-- Acceso a Andalucía -->
            <a href="./andalucia/" class="card">
                <div class="card-icon">🏫</div>
                <h2>Andalucía</h2>
            </a>
        </div>
    </main>

    <footer>
        <p>leonarperezaltamirano derechos reservados</p>
    </footer>

</body>
</html>
